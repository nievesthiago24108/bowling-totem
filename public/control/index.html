<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B1D30">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bowling · Control</title>
  <link rel="stylesheet" href="/shared/tema.css">
  <style>
    :root { --me: #3FB6E0; color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: var(--noche); color: var(--blanco);
      font-family: var(--texto);
      overscroll-behavior: none; touch-action: manipulation;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    body { position: fixed; inset: 0; }
    .screen {
      position: absolute; inset: 0; display: none; flex-direction: column; align-items: stretch;
      padding: max(16px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
      gap: 14px; background: var(--noche);
    }
    .screen.on { display: flex; }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 3px solid var(--azul); }
    .brand img { width: 52px; height: 52px; flex: none; }
    .brand .school { font-family: var(--titulo); font-weight: 600; font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--celeste); line-height: 1.2; }
    .brand.big { flex-direction: column; text-align: center; gap: 10px; border-bottom: 0; padding-bottom: 0; }
    .brand.big img { width: 96px; height: 96px; }
    h1 { margin: 0; font-family: var(--titulo); font-size: 56px; font-weight: 800; letter-spacing: 8px; text-align: center; line-height: 1; }
    .grow { flex: 1; min-height: 0; }
    .center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    label { font-family: var(--titulo); font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--celeste); }
    input[type=text] {
      width: 100%; font: inherit; font-size: 26px; font-weight: 600; padding: 15px 16px; border-radius: 4px;
      border: 2px solid var(--panel-2); background: var(--panel); color: var(--blanco);
      outline: none; -webkit-user-select: text; user-select: text;
    }
    input[type=text]:focus { border-color: var(--celeste); }
    button {
      font-family: var(--titulo); font-size: 26px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
      border: 0; border-radius: 4px; padding: 18px; color: var(--blanco); background: var(--azul-boton); cursor: pointer; touch-action: manipulation;
    }
    button:active { transform: translateY(1px); filter: brightness(0.92); }
    button:disabled { opacity: 0.4; }
    button.big { font-size: 30px; padding: 22px; }
    button.ghost { background: transparent; color: var(--celeste); font-size: 16px; padding: 8px 10px; border: 1px solid var(--panel-2); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--celeste); outline-offset: 2px; }
    .error { min-height: 24px; color: var(--rojo); font-weight: 600; text-align: center; }
    .card { background: var(--panel); border-radius: 4px; padding: 14px 16px; }
    .me { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; border-left: 8px solid var(--me); }
    .dot { width: 14px; height: 14px; flex: none; background: var(--me); }
    .me .dot { display: none; }
    .me .total { margin-left: auto; font-family: var(--titulo); font-size: 36px; font-weight: 800; }
    .section { font-family: var(--titulo); font-weight: 700; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: var(--gris); }
    .players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; overflow: auto; border-top: 1px solid var(--linea); }
    .players li { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; padding: 12px 4px; border-bottom: 1px solid var(--linea); }
    .players li.off { color: var(--gris); }
    .players .tag { margin-left: auto; font-family: var(--titulo); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--celeste); font-weight: 700; }
    .status { font-family: var(--titulo); font-size: 34px; font-weight: 800; letter-spacing: 1px; line-height: 1.15; }
    .sub { font-size: 17px; color: var(--gris); font-weight: 600; margin-top: 6px; }
    .count { font-family: var(--titulo); font-size: 150px; font-weight: 800; line-height: 1; }
    .reactions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .reactions button { font-size: 32px; padding: 12px 0; background: var(--panel); border-radius: 4px; letter-spacing: 0; }
    .reactions.wait button { opacity: 0.35; }
    .frames { display: flex; gap: 0; justify-content: center; margin-top: 12px; border: 1px solid var(--linea); max-width: 100%; overflow-x: auto; }
    .frames > div { min-width: 64px; padding: 6px 8px; text-align: center; flex: none; }
    .frames > div + div { border-left: 1px solid var(--linea); }
    .frames .m { font-family: var(--titulo); font-size: 20px; font-weight: 800; color: var(--naranja); letter-spacing: 3px; min-height: 24px; }
    .frames .c { font-family: var(--titulo); font-size: 24px; font-weight: 800; }
    .results { list-style: none; margin: 12px 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
    .results li { display: flex; align-items: center; gap: 12px; padding: 10px 6px; font-size: 20px; font-weight: 700; border-bottom: 1px solid var(--linea); }
    .results li.mine { background: var(--panel); box-shadow: inset 6px 0 0 var(--me); }
    .results .pts { margin-left: auto; font-family: var(--titulo); font-size: 26px; font-weight: 800; }
    /* centrado que no corta arriba si el contenido es más alto que la pantalla (se puede desplazar) */
    #watch-main { overflow-y: auto; justify-content: flex-start; }
    #watch-main > :first-child { margin-top: auto; }
    #watch-main > :last-child { margin-bottom: auto; }
    #s-join { overflow-y: auto; }
    @media (max-height: 600px) {
      .brand.big img { width: 60px; height: 60px; }
      h1 { font-size: 40px; }
      button.big { padding: 16px; }
    }
    .me [data-myname], .players li span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .puesto { margin-top: 12px; width: 100%; font-size: 17px; font-weight: 600; color: var(--gris); border-left: 6px solid var(--azul); text-align: left; }
    .puesto .record { margin-top: 4px; font-family: var(--titulo); font-size: 24px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--naranja); }
    a.link { display: block; text-align: center; color: var(--celeste); font-family: var(--titulo); font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
             text-decoration: none; padding: 12px; margin-top: 6px; }
    .credits { text-align: center; font-family: var(--titulo); font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--gris); }
    /* pantalla de tiro */
    #s-play { padding: 0; gap: 0; }
    #play-top { padding: max(12px, env(safe-area-inset-top)) 18px 10px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid var(--azul); }
    #play-top .dot { width: 10px; height: 44px; }
    #play-top .t { font-family: var(--titulo); font-size: 28px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    #play-top .info { font-family: var(--titulo); font-size: 15px; color: var(--celeste); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    #timer { margin-left: auto; min-width: 64px; text-align: center; font-family: var(--titulo); font-size: 36px; font-weight: 800; background: var(--panel); border-radius: 4px; padding: 2px 10px; }
    #timer.urgent { background: var(--naranja); color: var(--noche); }
    #lane { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; }
    #hint { text-align: center; font-weight: 600; color: var(--gris); font-size: 15px; pointer-events: none;
            padding: 10px 16px max(12px, env(safe-area-inset-bottom)); }
    #offline {
      position: fixed; inset: 0; display: none; z-index: 10; background: rgba(11, 29, 48, 0.94);
      flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: 24px; text-align: center;
    }
    #offline.on { display: flex; }
    #offline .status { color: var(--rojo); }
    .spinner { width: 48px; height: 48px; border-radius: 50%; border: 5px solid var(--panel-2);
               border-top-color: var(--celeste); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Unirse -->
  <section id="s-join" class="screen on">
    <div class="brand big"><img src="/shared/emblema.svg" alt=""><div class="school" data-school></div></div>
    <h1>BOWLING</h1>
    <div class="grow center" style="gap:14px; align-items:stretch">
      <label for="name">¿Cómo te llamás?</label>
      <input id="name" type="text" maxlength="14" autocomplete="nickname" autocapitalize="words"
             enterkeyhint="go" placeholder="Tu nombre" spellcheck="false">
      <div class="error" id="join-error"></div>
      <button id="join" class="big">Entrar</button>
    </div>
    <div class="sub" style="text-align:center">De 2 a 14 letras o números. Tu nombre va a aparecer en el ranking.</div>
    <div class="credits" data-creditos></div>
  </section>

  <!-- Esperando en el lobby -->
  <section id="s-lobby" class="screen">
    <div class="brand"><img src="/shared/emblema.svg" alt=""><div class="school" data-school></div></div>
    <div class="card me"><span class="dot"></span><span data-myname></span>
      <button class="ghost" id="rename" style="margin-left:auto">Cambiar</button></div>
    <div class="status" id="lobby-title">Ya estás adentro</div>
    <div class="section">Jugadores</div>
    <ul class="players grow" id="lobby-players"></ul>
    <div class="error" id="start-error"></div>
    <button id="start" class="big">Empezar</button>
    <div class="sub" id="lobby-wait" style="text-align:center"></div>
    <a class="link" href="/ranking/" target="_blank" rel="noopener">Ver ranking</a>
  </section>

  <!-- Tu turno: mini pista -->
  <section id="s-play" class="screen">
    <div id="play-top">
      <span class="dot"></span>
      <div><div class="t">Es tu turno</div><div class="info" id="play-info"></div></div>
      <div id="timer"></div>
    </div>
    <canvas id="lane"></canvas>
    <div id="hint">Arrastrá la bola a los costados · Deslizá hacia arriba para tirar</div>
  </section>

  <!-- Mirando: cuenta regresiva, turno de otro, resultados -->
  <section id="s-watch" class="screen">
    <div class="card me"><span class="dot"></span><span data-myname></span><span class="total" id="my-total"></span></div>
    <div class="grow center" id="watch-main"></div>
    <div class="reactions" id="reactions">
      <button data-emoji="👏">👏</button><button data-emoji="🔥">🔥</button><button data-emoji="😂">😂</button>
      <button data-emoji="😱">😱</button><button data-emoji="🎳">🎳</button>
    </div>
  </section>

  <div id="offline">
    <div class="spinner" id="offline-spin"></div>
    <div class="status" id="offline-text">Sin conexión</div>
    <div class="sub" id="offline-sub">Reconectando… Revisá que sigas en la wifi del tótem.</div>
    <button id="reconnect" style="display:none">Volver a conectar</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/j/gesture.js"></script>
  <script src="/j/control.js"></script>
</body>
</html>
